{% extends "base.html" %}

{% block title %}Create Poll{% endblock %}

{% block content %}
<div class="card">
    <h2>Create a New Poll</h2>

    <form action="{{ url_for('create_poll') }}" method="post">
        <div class="form-group">
            <label for="question">Question</label>
            <input type="text" id="question" name="question"
                   placeholder="What's your favorite programming language?"
                   required>
        </div>

        <div class="form-group">
            <label for="choices">Choices (one per line)</label>
            <textarea id="choices" name="choices"
                      placeholder="Python&#10;JavaScript&#10;Go&#10;Rust"
                      required></textarea>
            <small style="color: #888;">Enter at least 2 choices, one per line</small>
        </div>

        <button type="submit" class="btn btn-success">Create Poll</button>
        <a href="{{ url_for('index') }}" class="btn" style="margin-left: 10px; background: #95a5a6;">Cancel</a>
    </form>
</div>
{% endblock %}
